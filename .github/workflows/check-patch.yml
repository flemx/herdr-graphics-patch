name: Patch applies to latest herdr

on:
  push:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply to the latest herdr release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo herdrdev/herdr --json tagName --jq .tagName)
          echo "latest herdr release: $tag"
          git clone --quiet --depth 1 --branch "$tag" https://github.com/herdrdev/herdr.git herdr
          for patch in patches/*.patch; do
            git -C herdr apply --check "../$patch"
          done
